<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">

<title>S17 Surf</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 16px;
    background: #ececec;
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
}

.card {
    max-width: 500px;
    margin: 0 auto;
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,.15);
}

.header {
    background: #111;
    color: white;
    padding: 24px 20px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
}

.header p {
    margin: 7px 0 0;
    color: #bbb;
}

.section {
    padding: 21px 20px;
    border-bottom: 1px solid #ddd;
}

.section h2 {
    margin: 0 0 16px;
    font-size: 19px;
}

.big {
    font-size: 46px;
    font-weight: bold;
}

.row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 7px 0;
    font-size: 17px;
}

.label { color: #666; }

.value {
    font-weight: bold;
    text-align: right;
}

.temp {
    font-size: 43px;
    font-weight: bold;
}

.tide {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f3f3f3;
    padding: 13px;
    margin: 8px 0;
    border-radius: 10px;
}

.tide-type {
    font-weight: bold;
    min-width: 48px;
}

.tide-time { color: #555; }

.tide-height { font-weight: bold; }

.loading { color: #777; }

.source {
    margin-top: 8px;
    color: #777;
    font-size: 12px;
}

.footer {
    padding: 17px 20px;
    background: #fafafa;
    color: #777;
    font-size: 12px;
    line-height: 1.5;
}

.error {
    color: #a00;
}
</style>
</head>

<body>

<div class="card">

    <div class="header">
        <h1>S17 SURF</h1>
        <p id="date">Loading...</p>
    </div>

    <div class="section">
        <h2>🌊 HARVEST BUOY</h2>

        <div id="harvest" class="loading">
            Loading swell...
        </div>

        <div class="source">
            Harvest / CDIP 071 / NDBC 46218
        </div>
    </div>

    <div class="section">
        <h2>🌡️ CAMPUS POINT AREA</h2>

        <div id="waterTemp" class="temp loading">
            Loading...
        </div>

        <div class="source">
            Water temperature from NDBC 46053,
            East Santa Barbara
        </div>
    </div>

    <div class="section">
        <h2>🌊 TODAY'S TIDES</h2>

        <div id="tides" class="loading">
            Loading tides...
        </div>

        <div class="source">
            NOAA Santa Barbara 9411340
        </div>
    </div>

    <div class="footer">
        <strong>LIVE SURF CARD</strong><br>
        Data refreshes automatically through GitHub.<br>
        <span id="updated"></span>
    </div>

</div>

<script>

function compassDirection(degrees) {
    if (degrees === null || degrees === undefined) return "";

    const directions = [
        "N","NNE","NE","ENE",
        "E","ESE","SE","SSE",
        "S","SSW","SW","WSW",
        "W","WNW","NW","NNW"
    ];

    return directions[
        Math.round(degrees / 22.5) % 16
    ];
}


async function loadData() {

    try {

        /*
        Add timestamp to prevent the phone/browser
        from showing an old cached data.json file.
        */

        const response = await fetch(
            "data.json?t=" + Date.now()
        );

        if (!response.ok) {
            throw new Error("data.json not available");
        }

        const data = await response.json();


        /*
        DATE
        */

        document.getElementById("date").innerText =
            data.date_display;


        /*
        HARVEST
        */

        if (data.harvest && data.harvest.wave_height_ft !== null) {

            const direction =
                compassDirection(
                    data.harvest.direction_deg
                );

            document.getElementById("harvest").innerHTML = `

                <div class="big">
                    ${data.harvest.wave_height_ft.toFixed(1)} ft
                </div>

                <div class="row">
                    <span class="label">Dominant period</span>
                    <span class="value">
                        ${data.harvest.period_sec.toFixed(0)} sec
                    </span>
                </div>

                <div class="row">
                    <span class="label">Direction</span>
                    <span class="value">
                        ${direction}
                        ${Math.round(data.harvest.direction_deg)}°
                    </span>
                </div>

            `;

        } else {

            document.getElementById("harvest").innerHTML =
                '<span class="error">Harvest data unavailable</span>';

        }


        /*
        CAMPUS POINT AREA WATER TEMP
        */

        if (
            data.water_temp &&
            data.water_temp.temp_f !== null
        ) {

            document.getElementById("waterTemp").innerText =
                data.water_temp.temp_f.toFixed(1) + "°F";

            document.getElementById("waterTemp")
                .classList.remove("loading");

        } else {

            document.getElementById("waterTemp").innerText =
                "Unavailable";

        }


        /*
        TIDES
        */

        if (data.tides && data.tides.length > 0) {

            let tideHTML = "";

            data.tides.forEach(tide => {

                tideHTML += `

                    <div class="tide">

                        <span class="tide-type">
                            ${tide.type}
                        </span>

                        <span class="tide-time">
                            ${tide.time}
                        </span>

                        <span class="tide-height">
                            ${tide.height_ft.toFixed(1)} ft
                        </span>

                    </div>

                `;

            });

            document.getElementById("tides").innerHTML =
                tideHTML;

        } else {

            document.getElementById("tides").innerHTML =
                '<span class="error">Tide data unavailable</span>';

        }


        /*
        LAST UPDATE
        */

        document.getElementById("updated").innerText =
            "Data updated: " + data.updated_display;

    }

    catch(error) {

        console.error(error);

        document.getElementById("harvest").innerHTML =
            '<span class="error">Waiting for first data update...</span>';

        document.getElementById("waterTemp").innerText =
            "Waiting...";

        document.getElementById("tides").innerHTML =
            '<span class="error">Waiting for first data update...</span>';

        document.getElementById("date").innerText =
            new Date().toLocaleDateString(
                "en-US",
                {
                    weekday: "long",
                    month: "long",
                    day: "numeric",
                    year: "numeric"
                }
            );

    }

}

loadData();

</script>

</body>
</html>
